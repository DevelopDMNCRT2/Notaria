name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Continuous Deployment
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy to IONOS VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 74.208.149.57
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /root/notaria
            git pull origin main
            docker compose up -d --build
