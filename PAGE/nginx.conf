server {
    listen 80;
    server_name localhost;

    # --- Cuestionario (grill): sin indexar y sin access log (el token va en la URL) ---
    location /grill/ {
        access_log off;
        error_log /dev/stderr error;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        root /usr/share/nginx/html;
        try_files /grill.html =404;
    }

    location /api/grill/ {
        access_log off;
        error_log /dev/stderr error;    # los [warn] de nginx incluyen la URL con el token
        client_max_body_size 160m;
        proxy_request_buffering off;
        # Resolución en tiempo de ejecución: si el server no está, la landing pública sigue arriba.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $grill_upstream http://notaria-server:3000;
        proxy_pass $grill_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
    # --- fin grill ---

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
